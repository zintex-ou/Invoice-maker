workflows:
  ios-native-workflow:
    name: iOS Native
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: invoice

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.make.your.invoice
      vars:
        XCODE_PROJECT: "Invoice maker/Invoice maker.xcodeproj"
        XCODE_SCHEME: "Invoice maker"
        APP_STORE_APPLE_ID: "6747164323"
      xcode: 16.4

    scripts:
      - name: Debug project structure
        script: |
          cd "$CM_BUILD_DIR"
          pwd
          ls -la
          ls -la "Invoice maker"

      - name: List schemes
        script: |
          cd "$CM_BUILD_DIR"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Set up provisioning profiles
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build ipa for distribution
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-skipPackagePluginValidation -skipMacroValidation" \
            --export-flags="-skipPackagePluginValidation -skipMacroValidation"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients: [mandyagness@outlook.com]
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_app_store: false
